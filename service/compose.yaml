services:
  catalog:
    build:
      context: ..
      dockerfile: service/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    volumes:
      - catalog-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
volumes:
  catalog-data:
