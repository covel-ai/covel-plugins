name: Validate directory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/registry.mjs --check
      - run: node --test scripts/registry.test.mjs
