# Instantiate the __PLACEHOLDERS__ for one consumer; never run this template directly.
name: Collect __KIND__ and publish Pages
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: __KIND__-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.ingest.outcome == 'success' && vars.CATALOG_API_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: __PACKAGE_MANAGER__
      - run: __INSTALL_COMMAND__
      - run: __TEST_COMMAND__
      - uses: actions/cache/restore@v4
        id: resume
        if: vars.CATALOG_API_URL != ''
        with:
          path: |
            .cache/github
            .cache/round
          key: ${{ runner.os }}-__KIND__-v1-${{ __CONFIG_HASH_EXPRESSION__ }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-__KIND__-v1-${{ __CONFIG_HASH_EXPRESSION__ }}-
      - name: Collect complete public catalog and releases
        if: vars.CATALOG_API_URL != ''
        run: __COLLECT_COMMAND__
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REQUEST_BUDGET: 900
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
          CATALOG_INGEST_TOKEN: ${{ secrets.CATALOG_INGEST_TOKEN }}
      - name: Preserve progress even when GitHub collection failed
        if: always() && steps.resume.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/github
            .cache/round
          key: ${{ steps.resume.outputs.cache-primary-key }}
      - name: Build local preview when the service is not configured
        if: vars.CATALOG_API_URL == ''
        run: __GENERATE_COMMAND__
      - name: Build Pages artifact
        run: __BUILD_COMMAND__
        env:
          VITE_CATALOG_API: ${{ vars.CATALOG_API_URL }}
      - name: Ingest complete snapshot into the shared service
        id: ingest
        if: vars.CATALOG_API_URL != ''
        run: __PUBLISH_COMMAND__
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
          CATALOG_INGEST_TOKEN: ${{ secrets.CATALOG_INGEST_TOKEN }}
      - name: Upload reviewable build and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: __KIND__-catalog-${{ github.run_id }}
          path: |
            dist
            artifacts
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: steps.ingest.outcome == 'success'
        with:
          path: dist
  deploy:
    needs: collect-build
    if: needs.collect-build.outputs.deploy == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
